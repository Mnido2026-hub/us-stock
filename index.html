pan class='tag' style='background:#ffb74d22;color:#ffb74d'>籌碼<\/span>內部人：90 天內沒有公開市場買進；3 位賣出共 147,809 股，19 筆屬 Rule 10b5-1 預設計畫、1 筆不是。機構（13F，2026-06-30 持股、最晚 45 天後才公開）：兩季都申報的 5,618 家中加碼 3,188、減碼 2,430，前十大中兩季都申報的 9 家合計 +92.2 百萬股。放空餘額（FINRA，2026-10-30）60.9 百萬股、占流通股 0.82%、回補天數 2.73 天，近兩期一增一減。議員（STOCK Act，最多晚 45 天）：近 90 天買進 3 人、賣出 8 人；總統與行政官員申報尚未納入。<\/li><li><span class='tag' style='background:#ce93d822;color:#ce93d8'>基本面<\/span>截至 2026-09-30 的單季（財報 2026-10-28 申報）：營收 92.3 十億美元、年增 +18.8%（前一季 +17.7%）；毛利率 67.8%，對前一季 +0.6、對去年同季 -1.3 個百分點；營業利益率 49.8%（去年同季 48.9%）；稀釋 EPS 4.92、近四季 19.16（前四季 14.06，含業外損益）。近四季自由現金流 60.0 十億美元（前四季 78.0），單季資本支出 39.4（去年同季 19.4）。負債比 39.6%，一年前 42.9%。近四季每股股利 3.71 美元。<\/li><li><span class='tag' style='background:#b0bec522;color:#b0bec5'>新聞<\/span>本版尚未整理個股新聞，每日排程啟用後補上。<\/li><li><span class='tag' style='background:#f48fb122;color:#f48fb1'>展望<\/span>下一季財報的觀察點：營收年增是否維持在 +18.8% 附近或以上；毛利率是否高於去年同季；近四季自由現金流是否止跌或續增。籌碼面看下一期放空餘額的增減方向，以及是否出現內部人公開市場買進。<\/li><li><span class='tag' style='background:#80cbc422;color:#80cbc4'>操作<\/span>操作情境：訊號燈合計 +1（2 綠 1 黃 1 紅，滿分 +4）。綠燈：營業槓桿、營益率；紅燈：自由現金流。四盞燈都來自財報，每季財報公布後才會變；回測顯示「營業槓桿」與「營收加速」同時亮綠燈的公司，之後半年較常跑贏，自由現金流紅燈則偏弱。是規則型態整理，不是投資建議。<\/li><\/ul><\/details>","head":"<span class='px' style='color:#ef5350'>+18.8%<\/span><span class='dim'>單季營收年增｜<\/span><span style='color:#ef5350'>訊號燈 +1<\/span><span class='dim'>｜財報至 2026-09-30<\/span>","quote":"<div><span class='lab'>營收<\/span><span style='color:#eee'>92.3<\/span><\/div><div><span class='lab'>年增<\/span><span style='color:#ef5350'>+18.8%<\/span><\/div><div><span class='lab'>毛利率<\/span><span style='color:#26a69a'>67.8%<\/span><\/div><div><span class='lab'>營益率<\/span><span style='color:#ef5350'>49.8%<\/span><\/div><div><span class='lab'>EPS<\/span><span style='color:#ef5350'>4.92<\/span><\/div><div><span class='lab'>近四季EPS<\/span><span style='color:#ef5350'>19.16<\/span><\/div><div><span class='lab'>近四季FCF<\/span><span style='color:#26a69a'>60.0<\/span><\/div><div><span class='lab'>負債比<\/span>< meta":"key"},{"type":"scatter","mode":"markers","x":[null],"y":[null],"name":"≥5 億美元","marker":{"color":"rgba(176,190,197,.55)","size":16,"line":{"color":"#eceff1","width":0.6}},"hoverinfo":"skip","meta":"key"}],"hover":"closest","cap":"黃線是參考股價；每個圓點是一位內部人（董事、高階主管）一天內在公開市場的成交合計，紅＝買進、綠＝賣出。圓點大小＝成交金額：最小的圓約 500 萬美元，金額每多 10 倍圓點大一級（約 5,000 萬、5 億美元，見圖例灰色圓；圖例裡的圓只表示大小順序）。為了只看重要的交易，賣出只畫單日合計 500 萬美元以上的；買進很少見，全部都畫。這段期間另有 82 筆較小的賣出沒有畫（見右側「內部人」面板）。內部人依規定 2 個工作日內申報（實際中位數 2 天、九成在 4 天內），所以圓點的位置幾乎就是大家知道的時間。用法：看內部人是在相對高點賣、還是在低點買。高階主管按預設計畫定期賣股屬常態；值得注意的是出現紅點（自掏腰包買進），或股價下跌時多人同時大量賣出。黃線不是每日收盤價：它取自內部人向證管會申報的實際成交價（含繳稅扣股當天的市價），每天依股數加權平均，財報前後的禁售期沒有交易會斷線；每日收盤價屬授權資料，不能放在公開網站。回測看不出內部人買賣的預測力，僅供參考。"},{"title":"放空餘額（百萬股；最新占流通股 0.71%）","traces":[{"type":"scatter","mode":"lines+markers","x":["2024-09-13","2024-09-30","2024-10-15","2024-10-31","2024-11-15","2024-11-29","2024-12-13","2024-12-31","2025-01-15","2025-01-31","2025-02-14","2025-02-28","2025-03-14","2025-03-31","2025-04-15","2025-04-30","2025-05-15","2025-05-30","2025-06-13","2025-06-30","2025-07-15","2025-07-31","2025-08-15","2025-08-29","2025-09-15","2025-09-30","2025-10-15","2025-10-31","2025-11-14","2025-11-28","2025-12-15","2025-12-31","2026-01-15","2026-01-30","2026-02-13","2026-02-27","2026-03-13","2026-03-31","2026-04-15","2026-04-30","2026-05-15","2026-05-29","2026-06-15","2026-06-30","2026-07-15","2026-07-31","2026-08-14","2026-08-31","2026-09-15","2026-09-30","2026-10-15","2026-10-30"],"y":[79.6,71.1,68.5,64.3,68.7,69.8,71.0,65.6,65.5,60.2,66.2,63.5,72.0,67.3,68.7,69.0,74.3,66.3,67.9,76.5,58.2,57.4,59.2,55.5,67.3,59.5,58.3,67.3,62.5,79.3,82.1,82.7,83.9,75.9,73.6,76.3,80.0,79.7,78.1,75.6,82.1,82.9,89.8,85.9,78.7,70.5,72.7,77.7,87.4,80.4,78.4,87.6],"name":"放空餘額","line":{"color":"#4fc3f7","width":2},"marker":{"size":4},"fill":"tozeroy","fillcolor":"rgba(79,195,247,.12)"}],"cap":"放空餘額是市場上借股票賣出、還沒買回的股數，每月公布兩次。線往上＝看空或避險的部位增加；往下＝空單回補。大型股的放空比例通常只有 1% 上下，看的是方向變化，不是絕對水準。"}],"fundamentals":[{"title":"季營收（十億美元）與年增率","traces":[{"type":"bar","x": 方向，不是精確時點；多位議員同一段時間同方向交易才比較值得留意。金色外框的圓點是川普總統（本人與信託）申報的交易：同一份申報的買進（或賣出）合成一個點，大小＝合計金額；總統的資產由第三方管理、申報常晚一兩個月，看的是「公開時大家知道了什麼」。圓點一律畫在交易日，從圓點往右的虛線一直畫到公開日（右端有一條短直線），虛線越長＝越晚才讓大家知道。議員依規定 45 天內申報，實際中位數約 3～4 週，但約一成會拖到半年以上（灰色虛線）；總統通常晚 1～2 個月（中位數約 51 天，金色虛線），同一份申報的交易合成一個點，畫在中間的交易日；交易日讀不出來的，點就畫在公開日、沒有虛線。看到圓點時要記得：市場其實到虛線右端那天才知道。回測看不出議員或總統買賣的預測力，僅供參考。"},{"title":"內部人進出與參考股價（美元；紅＝買進、綠＝賣出；賣出只畫單日 ≥ 500 萬美元）","traces":[{"type":"scatter","mode":"lines","x":["2024-10-25","2024-10-30","2024-11-01","2024-11-04","2024-11-06","2024-11-07","2024-11-12","2024-11-15","2024-11-20","2024-11-25","2024-11-29","2024-12-02","2024-12-10","2024-12-12","2024-12-16","2024-12-25","2024-12-30","2024-12-31","2025-01-02","2025-01-09","2025-01-13","2025-01-15","2025-01-23","2025-01-25","2025-01-30","2025-01-31","2025-02-03","2025-02-18","2025-02-21","2025-02-25","2025-02-28","2025-03-03","2025-03-13","2025-03-25","2025-03-27","2025-03-28","2025-04-01","2025-04-02","2025-04-14","2025-04-16","2025-04-25","2025-04-30","2025-05-07","2025-05-13","2025-05-21","2025-05-22","2025-05-25","2025-05-30","2025-06-04","2025-06-13","2025-06-18","2025-06-25","2025-06-30","2025-07-02","2025-07-14","2025-07-16","2025-07-18","2025-07-25","2025-07-30","2025-08-04","2025-08-06","2025-08-08","2025-08-13","2025-08-15","2025-08-20","2025-08-25","2025-08-28","2025-09-03","2025-09-15","2025-09-17","2025-09-25","2025-09-29","2025-09-30","2025-10-01","2025-10-13","2025-10-15","2025-10-25","2025-10-30","2025-11-03","2025-11-05","2025-11-13","2025-11-17","2025-11-19","2025-11-25","2025-12-01","2025-12-02","2025-12-03","2025-12-15","2025-12-25","2025-12-30","2025-12-31","2026-01-07","2026-01-13","2026-01-21","2026-01-25","2026-01-29","2026-02-02","2026-02-04","2026-02-06","2026-02-13","2026-02-17","2026-02-18","2026-02-25","2026-03-02","2026-03-03","2026-03-04","2026-03-16","2026-03-18","2026-03-25","2026-03-27","2026-03-30","2026-04-01","2026-04-15","2026-04-25","2026-04-30","2026-05-15","2026-05-25","2026-05-29","2026-06-15","2026-06-25", ","size":7,"line":{"color":"#eceff1","width":0.6}},"hoverinfo":"skip","meta":"key"},{"type":"scatter","mode":"markers","x":[null],"y":[null],"name":"≈5,000 萬","marker":{"color":"rgba(176,190,197,.55)","size":11,"line":{"color":"#eceff1","width":0.6}},"hoverinfo":"skip","meta":"key"},{"type":"scatter","mode":"markers","x":[null],"y":[null],"name":"≥5 億美元","marker":{"color":"rgba(176,190,197,.55)","size":16,"line":{"color":"#eceff1","width":0.6}},"hoverinfo":"skip","meta":"key"}],"hover":"closest","cap":"黃線是參考股價；每個圓點是一位內部人（董事、高階主管）一天內在公開市場的成交合計，紅＝買進、綠＝賣出。圓點大小＝成交金額：最小的圓約 500 萬美元，金額每多 10 倍圓點大一級（約 5,000 萬、5 億美元，見圖例灰色圓；圖例裡的圓只表示大小順序）。為了只看重要的交易，賣出只畫單日合計 500 萬美元以上的；買進很少見，全部都畫。這段期間另有 94 筆較小的賣出沒有畫（見右側「內部人」面板）。內部人依規定 2 個工作日內申報（實際中位數 2 天、九成在 4 天內），所以圓點的位置幾乎就是大家知道的時間。用法：看內部人是在相對高點賣、還是在低點買。高階主管按預設計畫定期賣股屬常態；值得注意的是出現紅點（自掏腰包買進），或股價下跌時多人同時大量賣出。黃線不是每日收盤價：它取自內部人向證管會申報的實際成交價（含繳稅扣股當天的市價），每天依股數加權平均，財報前後的禁售期沒有交易會斷線；每日收盤價屬授權資料，不能放在公開網站。回測看不出內部人買賣的預測力，僅供參考。"},{"title":"放空餘額（百萬股；最新占流通股 0.87%）","traces":[{"type":"scatter","mode":"lines+markers","x":["2024-09-13","2024-09-30","2024-10-15","2024-10-31","2024-11-15","2024-11-29","2024-12-13","2024-12-31","2025-01-15","2025-01-31","2025-02-14","2025-02-28","2025-03-14","2025-03-31","2025-04-15","2025-04-30","2025-05-15","2025-05-30","2025-06-13","2025-06-30","2025-07-15","2025-07-31","2025-08-15","2025-08-29","2025-09-15","2025-09-30","2025-10-15","2025-10-31","2025-11-14","2025-11-28","2025-12-15","2025-12-31","2026-01-15","2026-01-30","2026-02-13","2026-02-27","2026-03-13","2026-03-31","2026-04-15","2026-04-30","2026-05-15","2026-05-29","2026-06-15","2026-06-30","2026-07-15","2026-07-31","2026-08-14","2026-08-31","2026-09-15","2026-09-30","2026-10-15","2026-10-30"],"y":[83.8,92.6,83.9,76.6,83.8,80.5,83.3,82.9,82.0,70.8,69.7,71.1,78.7,70.7,71.2,65.7,71.5,61.4,61.8,70.7,62.8,63.6,75.7,68.6,69.9,77.0,74.5,70.1,70.6,73.3,76.1,73.4,78.1,71.8,87.0,81.9,84.8,87.6,93.0,90.9,104.3,92.5,99.0,100.3,106.6,98.4,95.3,92.1,81.4,86.7,93.7,94.4],"name":"放空餘額","li a(176,190,197,.55)","size":16,"line":{"color":"#eceff1","width":0.6}},"hoverinfo":"skip","meta":"key"}],"hover":"closest","cap":"黃線是參考股價；每個圓點是一位內部人（董事、高階主管）一天內在公開市場的成交合計，紅＝買進、綠＝賣出。圓點大小＝成交金額：最小的圓約 500 萬美元，金額每多 10 倍圓點大一級（約 5,000 萬、5 億美元，見圖例灰色圓；圖例裡的圓只表示大小順序）。為了只看重要的交易，賣出只畫單日合計 500 萬美元以上的；買進很少見，全部都畫。這段期間另有 21 筆較小的賣出沒有畫（見右側「內部人」面板）。內部人依規定 2 個工作日內申報（實際中位數 2 天、九成在 4 天內），所以圓點的位置幾乎就是大家知道的時間。用法：看內部人是在相對高點賣、還是在低點買。高階主管按預設計畫定期賣股屬常態；值得注意的是出現紅點（自掏腰包買進），或股價下跌時多人同時大量賣出。黃線不是每日收盤價：它取自內部人向證管會申報的實際成交價（含繳稅扣股當天的市價），每天依股數加權平均，財報前後的禁售期沒有交易會斷線；每日收盤價屬授權資料，不能放在公開網站。回測看不出內部人買賣的預測力，僅供參考。 黃色虛線是公司最近四季買回庫藏股的平均價。"},{"title":"放空餘額（百萬股；最新占流通股 1.16%）","traces":[{"type":"scatter","mode":"lines+markers","x":["2024-09-13","2024-09-30","2024-10-15","2024-10-31","2024-11-15","2024-11-29","2024-12-13","2024-12-31","2025-01-15","2025-01-31","2025-02-14","2025-02-28","2025-03-14","2025-03-31","2025-04-15","2025-04-30","2025-05-15","2025-05-30","2025-06-13","2025-06-30","2025-07-15","2025-07-31","2025-08-15","2025-08-29","2025-09-15","2025-09-30","2025-10-15","2025-10-31","2025-11-14","2025-11-28","2025-12-15","2025-12-31","2026-01-15","2026-01-30","2026-02-13","2026-02-27","2026-03-13","2026-03-31","2026-04-15","2026-04-30","2026-05-15","2026-05-29","2026-06-15","2026-06-30","2026-07-15","2026-07-31","2026-08-14","2026-08-31","2026-09-15","2026-09-30","2026-10-15","2026-10-30"],"y":[275.3,251.1,255.8,246.4,276.4,264.1,279.7,287.9,287.1,271.4,241.7,241.4,258.1,234.4,263.0,249.8,244.0,229.3,206.8,243.0,201.7,192.1,205.2,196.7,217.5,226.8,211.0,238.6,237.2,232.9,264.3,256.8,261.8,257.1,254.3,248.3,229.2,280.9,283.3,282.9,297.0,284.7,299.7,310.1,324.1,292.7,286.0,298.3,294.2,311.4,301.6,279.6],"name":"放空餘額","line":{"color":"#4fc3f7","width":2},"marker":{"size":4},"fill":"tozeroy","fillcolor":"rgba(79,195,247,.12)"}],"cap":"放空餘額是市場上借股票賣出、還沒買回的股數，每月公布兩次。線往上＝看空或避險的部位增加；往下＝空單回補。大型股的放空比例通常只有 1% 上下，看的是方向變化，不是絕對水準。"}],"fundamentals":[{"title":"季營收（十億美元）與年增率","traces":[{"type":"bar","x":["23/07","23/10","24/01","24/04"," "skip","meta":"key"}],"hover":"closest","cap":"黃線是同一條參考股價；每個圓點是一筆國會議員（含配偶、子女）申報的交易，畫在最接近交易日的參考股價上。紅＝買進、綠＝賣出。圓點大小＝申報金額區間的中間值：最小的圓是 1,001～15,000 美元，約 10 萬美元是中圓，100 萬美元以上是大圓（見圖例灰色圓；圖例裡的圓只表示大小順序）。議員只申報金額區間、最晚 45 天後才公開，看的是方向，不是精確時點；多位議員同一段時間同方向交易才比較值得留意。金色外框的圓點是川普總統（本人與信託）申報的交易：同一份申報的買進（或賣出）合成一個點，大小＝合計金額；總統的資產由第三方管理、申報常晚一兩個月，看的是「公開時大家知道了什麼」。圓點一律畫在交易日，從圓點往右的虛線一直畫到公開日（右端有一條短直線），虛線越長＝越晚才讓大家知道。議員依規定 45 天內申報，實際中位數約 3～4 週，但約一成會拖到半年以上（灰色虛線）；總統通常晚 1～2 個月（中位數約 51 天，金色虛線），同一份申報的交易合成一個點，畫在中間的交易日；交易日讀不出來的，點就畫在公開日、沒有虛線。看到圓點時要記得：市場其實到虛線右端那天才知道。回測看不出議員或總統買賣的預測力，僅供參考。另有 22 筆交易前後 12 天內沒有參考股價，未畫在圖上（見右側「議員」面板）。"},{"title":"內部人進出與參考股價（美元；紅＝買進、綠＝賣出；賣出只畫單日 ≥ 500 萬美元）","traces":[{"type":"scatter","mode":"lines","x":["2024-11-25","2024-12-11","2024-12-13","2024-12-16","2025-01-06","2025-01-07",null,"2025-03-10","2025-03-13","2025-03-19","2025-03-20","2025-03-21",null,"2025-05-30","2025-06-02","2025-06-03","2025-06-06","2025-06-09","2025-06-18","2025-06-20","2025-06-23","2025-06-24","2025-06-25","2025-06-26","2025-06-27","2025-06-30","2025-07-01","2025-07-02","2025-07-03","2025-07-07","2025-07-08","2025-07-09","2025-07-10","2025-07-11","2025-07-14","2025-07-15","2025-07-16","2025-07-17","2025-07-18","2025-07-21","2025-07-22","2025-07-23","2025-07-24","2025-07-25","2025-07-28","2025-07-29","2025-07-30","2025-07-31","2025-08-01","2025-08-04","2025-08-05","2025-08-06","2025-08-07","2025-08-08","2025-08-11","2025-08-12","2025-08-13","2025-08-14","2025-08-15","2025-08-29","2025-09-02","2025-09-03","2025-09-04","2025-09-05","2025-09-08","2025-09-09","2025-09-10","2025-09-11","2025-09-12","2025-09-15","2025-09-16","2025-09-17","2025-09-18","2025-09-19","2025-09-22","2025-09-23","2025-09-24","2025-09-25","2025-09-26","2025-09-29","2025-09-30","2025-10-01","2025-10-02","2025-10-03","2025-10-06","2025-10-07","2025-10-08","2025-10-09","2025-10-10","2025-10-13","2025-10-14","2025-10-15","2025-10-16","2025-10-17","2025-10-20","2025-10-21","2025-10-22","2025-10-23","2025-10-24","2025-10-27","2025-10-28","2025 osest","cap":"黃線是參考股價；每個圓點是一位內部人（董事、高階主管）一天內在公開市場的成交合計，紅＝買進、綠＝賣出。圓點大小＝成交金額：最小的圓約 500 萬美元，金額每多 10 倍圓點大一級（約 5,000 萬、5 億美元，見圖例灰色圓；圖例裡的圓只表示大小順序）。為了只看重要的交易，賣出只畫單日合計 500 萬美元以上的；買進很少見，全部都畫。這段期間另有 26 筆較小的賣出沒有畫（見右側「內部人」面板）。內部人依規定 2 個工作日內申報（實際中位數 2 天、九成在 4 天內），所以圓點的位置幾乎就是大家知道的時間。用法：看內部人是在相對高點賣、還是在低點買。高階主管按預設計畫定期賣股屬常態；值得注意的是出現紅點（自掏腰包買進），或股價下跌時多人同時大量賣出。黃線不是每日收盤價：它取自內部人向證管會申報的實際成交價（含繳稅扣股當天的市價），每天依股數加權平均，財報前後的禁售期沒有交易會斷線；每日收盤價屬授權資料，不能放在公開網站。回測看不出內部人買賣的預測力，僅供參考。"},{"title":"放空餘額（百萬股；最新占流通股 1.67%）","traces":[{"type":"scatter","mode":"lines+markers","x":["2024-09-13","2024-09-30","2024-10-15","2024-10-31","2024-11-15","2024-11-29","2024-12-13","2024-12-31","2025-01-15","2025-01-31","2025-02-14","2025-02-28","2025-03-14","2025-03-31","2025-04-15","2025-04-30","2025-05-15","2025-05-30","2025-06-13","2025-06-30","2025-07-15","2025-07-31","2025-08-15","2025-08-29","2025-09-15","2025-09-30","2025-10-15","2025-10-31","2025-11-14","2025-11-28","2025-12-15","2025-12-31","2026-01-15","2026-01-30","2026-02-13","2026-02-27","2026-03-13","2026-03-31","2026-04-15","2026-04-30","2026-05-15","2026-05-29","2026-06-15","2026-06-30","2026-07-15","2026-07-31","2026-08-14","2026-08-31","2026-09-15","2026-09-30","2026-10-15","2026-10-30"],"y":[77.2,74.3,79.4,77.9,76.4,77.2,80.8,67.4,63.3,59.6,61.5,67.1,81.3,76.5,81.3,81.3,85.0,77.0,77.1,80.1,70.0,72.0,76.7,78.3,86.2,76.8,72.7,72.2,71.2,78.3,74.7,67.9,64.4,64.4,64.8,61.8,60.9,65.6,71.1,76.7,75.2,76.9,78.2,79.1,70.6,68.5,69.2,74.2,68.9,70.9,69.4,66.0],"name":"放空餘額","line":{"color":"#4fc3f7","width":2},"marker":{"size":4},"fill":"tozeroy","fillcolor":"rgba(79,195,247,.12)"}],"cap":"放空餘額是市場上借股票賣出、還沒買回的股數，每月公布兩次。線往上＝看空或避險的部位增加；往下＝空單回補。大型股的放空比例通常只有 1% 上下，看的是方向變化，不是絕對水準。"}],"fundamentals":[{"title":"季營收（十億美元）與年增率","traces":[{"type":"bar","x":["23/09","23/12","24/03","24/06","24/09","24/12","25/03","25/06","25/09","25/12","26/03","26/06","26/09"],"y":[23.35,25.17,21.3,25.5,25.18,25.71,19.34,22.5,28.09,24.9,22.39,28.24,28.05],"name":"季營收","marker":{"color":"#4fc3 方向，不是精確時點；多位議員同一段時間同方向交易才比較值得留意。金色外框的圓點是川普總統（本人與信託）申報的交易：同一份申報的買進（或賣出）合成一個點，大小＝合計金額；總統的資產由第三方管理、申報常晚一兩個月，看的是「公開時大家知道了什麼」。圓點一律畫在交易日，從圓點往右的虛線一直畫到公開日（右端有一條短直線），虛線越長＝越晚才讓大家知道。議員依規定 45 天內申報，實際中位數約 3～4 週，但約一成會拖到半年以上（灰色虛線）；總統通常晚 1～2 個月（中位數約 51 天，金色虛線），同一份申報的交易合成一個點，畫在中間的交易日；交易日讀不出來的，點就畫在公開日、沒有虛線。看到圓點時要記得：市場其實到虛線右端那天才知道。回測看不出議員或總統買賣的預測力，僅供參考。另有 3 筆交易前後 12 天內沒有參考股價，未畫在圖上（見右側「議員」面板）。"},{"title":"內部人進出與參考股價（美元；紅＝買進、綠＝賣出；賣出只畫單日 ≥ 500 萬美元）","traces":[{"type":"scatter","mode":"lines","x":["2024-10-24","2024-11-08","2024-11-11","2024-11-15","2024-12-02","2024-12-04","2024-12-06","2025-01-06","2025-02-03","2025-02-06","2025-03-03","2025-03-06","2025-03-10","2025-04-07","2025-04-24","2025-04-29","2025-05-01","2025-05-06","2025-05-09","2025-05-16","2025-05-27","2025-06-02","2025-06-03","2025-06-09","2025-06-12","2025-07-07","2025-07-08",null,"2025-08-26","2025-09-08","2025-09-11","2025-09-12","2025-09-15",null,"2025-12-08","2025-12-09","2026-01-02",null,"2026-02-25","2026-03-06","2026-03-30","2026-04-30","2026-05-13","2026-06-08","2026-06-16",null,"2026-09-08"],"y":[250.0,300.37,346.18,314.44,354.09,352.54,374.21,411.75,383.99,367.87,299.43,268.73,240.79,250.0,256.31,285.58,284.4,274.12,300.0,350.11,357.31,341.02,350.0,285.71,323.81,292.89,300.0,null,350.29,352.38,363.75,389.28,422.68,null,443.93,450.66,445.4,null,415.56,397.03,359.33,378.11,450.0,402.2,404.66,null,360.13],"name":"參考股價","connectgaps":false,"line":{"color":"#ffd54f","width":1.4},"hovertemplate":"%{x} 約 %{y:.2f} 美元<extra>參考股價<\/extra>"},{"type":"scatter","mode":"markers","x":["2025-09-12","2025-04-24"],"y":[389.28,256.31],"name":"內部人買進","text":["Musk Elon 2,568,732 股，約 1,000.0 百萬美元","Gebbia Joseph 4,000 股，約 1.0 百萬美元"],"marker":{"color":"#ef5350","symbol":"circle","size":[31.01012207625697,8],"opacity":0.7,"line":{"color":"#eceff1","width":0.6}},"hovertemplate":"%{x} 成交價 %{y:.2f}<br>%{text}<extra><\/extra>"},{"type":"scatter","mode":"markers","x":["2026-04-30","2026-03-30","2026-02-25","2026-01-02","2025-12-09","2025-09   if(p.y2!==undefined){L.yaxis2=Object.assign({},AX,{overlaying:'y',side:'right',showgrid:false,ticksuffix:p.y2,nticks:5,tickformat:(p.y2==='%'?'.0f':'')});if(p.y2range)L.yaxis2.range=p.y2range;if(p.yrange)L.yaxis.range=p.yrange;L.yaxis2.zeroline=false;L.margin.r=44;}
  if(p.barmode)L.barmode=p.barmode;if(p.hover)L.hovermode=p.hover;
  if(p.tree){L.margin={l:4,r:4,t:4,b:4};p.traces[0].marker.showscale=window.innerWidth>=900;L.showlegend=false;el.style.height=(window.innerWidth<900?420:520)+'px';}
  if(p.heat){L.hovermode='closest';L.showlegend=false;L.margin.l=(window.innerWidth<900?110:180);L.margin.r=60;L.yaxis.autorange='reversed';L.yaxis.tickfont={size:10};L.xaxis.type='category';L.xaxis.side='top';el.style.height=(p.rows*24+70)+'px';}
  if(p.hbar){L.hovermode='closest';L.margin.l=(window.innerWidth<900?120:170);L.showlegend=false;L.yaxis.tickfont={size:10};}
  if(p.traces.length<2)L.showlegend=false;L.margin.t=p.traces.length<2?8:26;
  var TR=p.traces;
  if(window.innerWidth<900){   // 手機：同一份資料，只調整顯示方式
    TR=JSON.parse(JSON.stringify(p.traces));L.legend.font={size:9};
    TR.forEach(function(t){if(t.meta==='key'||(t.name&&/→|近四季買回/.test(t.name)))t.showlegend=false;});
    if(p.heat){var k=4;TR.forEach(function(t){if(t.type!=='heatmap')return;t.showscale=false;
      t.x=t.x.slice(-k);t.z=t.z.map(function(r){return r.slice(-k)});t.text=t.text.map(function(r){return r.slice(-k)});
      if(t.customdata)t.customdata=t.customdata.map(function(r){return r.slice(-k)});
      t.y=t.y.map(function(y){var m=y.match(/^(.*?)\s+([\d.]+%)$/);return m?(m[1].length>13?m[1].slice(0,12)+'…':m[1])+' '+m[2]:y;});
      t.textfont={size:9,color:'#eceff1'};});L.margin.l=8;L.yaxis.automargin=true;L.margin.r=6;L.yaxis.tickfont={size:9};el.style.height=(p.rows*26+50)+'px';}
  }
  Plotly.newPlot(el,TR,L,{displayModeBar:false,responsive:true});});}
function panelHtml(){return pan==='scan'?"<div class='scanwrap'>"+G.scan+"</div>":((D[cur]||{})[pan]||"<div class='dim'>無資料</div>");}
function scanSort(th,i){var tb=th.closest('table').querySelector('tbody'),rows=[].slice.call(tb.rows),asc=th.dataset.asc==='1';th.dataset.asc=asc?'0':'1';
 rows.sort(function(a,b){var x=a.cells[i].dataset.v,y=b.cells[i].dataset.v,nx=parseFloat(x),ny=parseFloat(y);var c=(isNaN(nx)||isNaN(ny))?String(x).localeCompare(String(y)):nx-ny;return asc?c:-c;});
 rows.forEach(function(r){tb.appendChild(r)});th.closest('thead').querySelectorAll('th').forEach(function(h){h.style.color=h===th?'#4fc3f7':''});}
function save(){try{localStorage.setItem('us_stock_view',JSON.stringify({cur:cur,tab:tab,pan:pan}))}catch(e){}}
function showPanel(){var p=document.getElementById('panel');p.dataset.p=pan;p.innerHTML=panelHtml();document.querySelectorAll('#rtabs button').forEach(function(b){b.classList.toggle('on',b.dataset.p===pan)});}
function render(){var d=D[cur]||{};document.getElementById('head').innerHTML=d.head||'';document.getElementById('quote').innerHTML=d.quote||'';document.getElementById('stock').value=cur;
 document.querySelectorAll('#ltabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});showPanel();draw();save();}
function pick(t){cur=t;render();window.scrollTo(0,0);}
document.getElementById('stock').onchange=function(e){cur=e.target.value;render();};
document.querySelectorAll('#ltabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;document.querySelectorAll('#ltabs button').forEach(function(x){x.classList.toggle('on',x===b)});draw();save();}});
document.querySelectorAll('#rtabs button').forEach(function(b){b.onclick=function(){pan=b.dataset.p;showPanel();save();}});
try{var v=JSON.parse(localStorage.getItem('us_stock_view')||'null');if(v){if(D[v.cur])cur=v.cur;if(D[cur].charts[v.tab])tab=v.tab;if(v.pan==='scan'||D[cur][v.pan])pan=v.pan;}}catch(e){}
render();
</script>
